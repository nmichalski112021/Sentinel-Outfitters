services:
  - type: web
    name: sentinel-outfitters
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: SITE_URL
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
